<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>Validação de Campos em JavaScript</h1>

    <form id="myForm">
        <div class="form-group">
            <label for="name">Nome:</label>
            <input class="obg" type="text" id="name">
            <span class="error-message"></span>
        </div>
        <div class="form-group">
            <label for="email">E-mail:</label>
            <input class="obg" type="email" name="email" id="email">
            <span class="error-message"></span>
        </div>
        <div class="form-group">
            <label for="password">Senha:</label>
            <input class="obg" type="password" name="password" id="password" >
            <span class="error-message"></span>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirmar Senha:</label>
            <input class="obg" type="password" name="confirmPassword" id="confirmPassword">
            <span class="error-message"></span>
        </div>

        <button type="submit">Enviar</button>
    </form>


    <script src="script.js"></script>
</body>
</html>
